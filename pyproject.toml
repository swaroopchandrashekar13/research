[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragmv"
version = "0.1.0"
description = "Multiverse analysis of chunking comparisons in retrieval-augmented generation"
# numpy 2.5.3 and scipy 1.18.1 (the pinned versions that produced the results) require Python >= 3.12.
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.3",
  "PyYAML==6.0.1",
  "bm25s==0.2.13",
  "PyStemmer==2.2.0.3",
  "scipy==1.18.1",
  "statsmodels==0.15.0",
  "pandas==3.0.5",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.3"]
generation = ["google-genai==2.31.0", "llama-cpp-python==0.3.36", "huggingface_hub==2.2.0"]
dense = ["torch==2.14.1", "transformers==5.20.1", "sentence-transformers==6.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
