[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragmv"
version = "0.1.0"
description = "Multiverse analysis of chunking comparisons in retrieval-augmented generation"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.5.3",
  "PyYAML==6.0.1",
  "bm25s==0.2.13",
  "PyStemmer==2.2.0.3",
  "scipy==1.18.1",
  "statsmodels==0.15.0",
  "matplotlib==3.11.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
