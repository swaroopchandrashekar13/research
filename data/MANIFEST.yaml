policy: >-
  We do not redistribute any dataset file. Derived artefacts are aggregate statistics and per-query metric values
  keyed by the datasets' question IDs, except experiments/E2_generation/runs/**/generations.jsonl, which stores each
  sampled question's gold answer strings (copied from the datasets) and the model's answers, which often reproduce
  passage wording. Those strings remain under the source datasets' licences (SQuAD 2.0 CC BY-SA 4.0, COVID-QA
  Apache-2.0, CUAD and Qasper CC BY 4.0); see LICENSE-DATA.md. The metrics-only release package
  (tools/stage_release.py) carries no answer or response strings.
