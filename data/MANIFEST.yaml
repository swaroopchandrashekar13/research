# Dataset provenance. Raw data is NOT committed (see .gitignore); `python -I -m ragmv.fetch` downloads
# from the original sources and refuses files whose SHA256 differs from the values below.
# Licences: "verified-repo-licence" = a licence file was read from the source repository; "dataset-card" = the licence
# field of the publisher's or authors' Hugging Face dataset card (an authoritative statement, but not a licence file and
# not legal advice). Neither is a legal clearance for redistribution.

datasets:
  squad2:
    description: "SQuAD 2.0 dev set; 35 Wikipedia articles (median ~4,000 words), 5,928 answerable questions with answer spans"
    files:
      - url: https://raw.githubusercontent.com/rajpurkar/SQuAD-explorer/master/dataset/dev-v2.0.json
        path: data/raw/squad2/dev-v2.0.json
        sha256: 80a5225e94905956a6446d296ca1093975c4d3b3260f1d6c8f68bc2ab77182d8
    licence: "CC BY-SA 4.0 per the authors' Hugging Face dataset card rajpurkar/squad_v2 (read 2026-10-25: 'The dataset is distributed under the CC BY-SA 4.0 license'); not stated in the SQuAD-explorer repository README; the SQuAD website was not reachable from the checking environment"
    licence_status: dataset-card
    retrieved: 2026-10-18

  covidqa:
    description: "COVID-QA (deepset); 147 biomedical papers (median ~3,600 words), 2,019 questions with answer spans"
    files:
      - url: https://raw.githubusercontent.com/deepset-ai/COVID-QA/master/data/question-answering/COVID-QA.json
        path: data/raw/covidqa/COVID-QA.json
        sha256: 291abf17f4bc2bd343838fd8ef5debb6278bbbb61b262db1f1bd58048fff76b9
    licence: "Apache-2.0 (repository LICENSE file, read 2026-10-25; the deepset/covid_qa_deepset dataset card agrees)"
    licence_status: verified-repo-licence
    retrieved: 2026-10-18

  cuad:
    description: "CUAD v1 test split; 102 commercial contracts (median ~3,900 words), 4,182 clause questions, 1,244 answerable"
    files:
      - url: https://raw.githubusercontent.com/TheAtticusProject/cuad/main/data.zip
        path: data/raw/cuad/data.zip
        sha256: f8161d18bea4e9c05e78fa6dda61c19c846fb8087ea969c172753bc2f45b999a
        extract: [test.json]
        # Member digests derived 2026-10-24 from the archive above after its SHA-256 matched (data-integrity repair).
        members:
          test.json: {sha256: 007b6a40b0c65247f881627375c3d2e9b6aeeb5dfa89957494feed0765a1a073, size: 7378232}
    licence: "CC BY 4.0 per the publisher's Hugging Face dataset card theatticusproject/cuad-qa (read 2026-10-25), which adds that the creators make no representations or warranties regarding the license status of the underlying contracts (public EDGAR filings); the repository README could not be fetched"
    licence_status: dataset-card
    retrieved: 2026-10-18

  qasper:
    description: "Qasper v0.3 (AllenAI); NLP papers with paragraph structure (median ~3,300 words), questions with evidence paragraphs"
    files:
      - url: https://qasper-dataset.s3.us-west-2.amazonaws.com/qasper-train-dev-v0.3.tgz
        path: data/raw/qasper/qasper-train-dev-v0.3.tgz
        sha256: a28fdf966db827bcee3d873107d6b6669864fb7ca8fbf73a192f5e39191bdb5a
        extract: [qasper-dev-v0.3.json]
        members:  # derived 2026-10-24 from the hash-verified archive
          qasper-dev-v0.3.json: {sha256: 2ae7ee62a65b1c4225791c70de80c2aad4e8998cf1fd4f09a53103db4f21af93, size: 11398686}
      - url: https://qasper-dataset.s3.us-west-2.amazonaws.com/qasper-test-and-evaluator-v0.3.tgz
        path: data/raw/qasper/qasper-test-and-evaluator-v0.3.tgz
        sha256: 72a52a41193e2838b8074f80ac074b94f956b84886c36a61c58a7df4171bdd72
        extract: [qasper-test-v0.3.json]
        members:  # derived 2026-10-24 from the hash-verified archive
          qasper-test-v0.3.json: {sha256: 6e29ad410e6e39aa1936017fb965b30a20eb2e7751997f55b97c9d281aa884e5, size: 18078957}
    licence: "CC BY 4.0 per the publisher's Hugging Face dataset card allenai/qasper (read 2026-10-25); not stated in the archive README"
    licence_status: dataset-card
