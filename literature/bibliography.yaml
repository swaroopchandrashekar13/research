  # ---------- RAG ingestion, corpus faults, robustness ----------
  - key: silentfailurerag2026
    title: "Silent-failure detection in RAG pipelines: A controlled fault-injection study of multi-layer quality gates"
    authors: null
    year: 2026
    venue: "Elsevier journal (PII S2590-1230..., consistent with Results in Engineering; not confirmed)"
    id: "PII S259012302604096X"
    url: https://www.sciencedirect.com/science/article/pii/S259012302604096X
    peer_reviewed: true
    verification: L1
    snippet_summary: >-
      Offline fault injection on BM25, BGE-dense and hybrid+rerank pipelines; 12 faults across retrieval,
      context, prompt and fallback (stale index, chunk-boundary corruption, embedding mismatch, top-k truncation,
      reranker disabling, distractor injection, context overflow/shuffle, prompt drift, citation suppression,
      fallback bypass, duplicate-source inflation); 146,016 traces. Several faults keep answer-level acceptability
      while degrading evidence, citation, abstention or provenance; a composite multi-layer gate beats
      single-layer detectors. Does not estimate prevalence in live traffic; gates need per-deployment calibration.
    directions: [C3, C5]
    notes: "Closest prior work to C3. Must be read in full (L3) before C3 can be claimed novel."

