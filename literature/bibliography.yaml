# verification levels (see literature/PROTOCOL.md):
#   L0  not checked (from memory) — must never be cited
#   L1  existence confirmed in a search index (title + arXiv ID/DOI/venue URL); content known only from snippets
#   L2  abstract read on the primary page (arXiv abs / venue page)
#   L3  full text read; extracted fields checked against the paper
