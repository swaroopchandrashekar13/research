  - key: li2026exactlyonce
    title: "Where Does Exactly-Once Live? Model, Harness, and Tool-Contract Effects on Duplicate Side Effects in LLM Agents"
    authors: ["Jiapeng Li"]
    year: 2026
    venue: arXiv
    id: "arXiv:2609.29095"
    url: https://arxiv.org/abs/2609.29095
    peer_reviewed: false
    verification: L1
    snippet_summary: >-
      LIMBO deterministic sandbox (6 services, 12 fault modes, ledger of committed effects; 25,930 episodes).
      Model matters when read-back reveals state; otherwise duplicates are common even for frontier models.
      Idempotency keys cut duplicate rate 28% -> 4%; harness mattered little. Proves no verification-only
      policy is exactly-once under late commits without a bound on in-flight time.
    directions: [C1]

